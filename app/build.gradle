plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zpl.handcricket'
    compileSdk 34

    defaultConfig {
        applicationId "com.zpl.handcricket"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Fill these in via local.properties or Gradle properties:
        //   BASE_URL=https://your-backend.example.com
        //   WS_URL=wss://your-backend.example.com/ws/game
        buildConfigField "String", "BASE_URL", "\"${System.getenv('BASE_URL') ?: project.findProperty('BASE_URL') ?: 'http://10.163.3.176:8080'}\""
        buildConfigField "String", "WS_URL",   "\"${System.getenv('WS_URL')   ?: project.findProperty('WS_URL')   ?: 'ws://10.163.3.176:8080/ws/game'}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
